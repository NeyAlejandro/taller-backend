$kind: http-request
description: |-
  Actualiza todos los campos del estudiante con id=1.
  Cambia el numero en la URL por el id del estudiante a editar.
  Retorna 200 OK con los datos actualizados, o 404 si no existe.
url: "{{base_url}}/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ana Maria Lopez",
      "email": "ana.maria@taller.com",
      "curso": "11A"
    }
order: 5000
